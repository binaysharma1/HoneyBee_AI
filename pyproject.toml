[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "binay_sharma", email = "binaysharma0064@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.115.0",
    "langchain-openai>=0.3.0",
    "mem0ai>=2.2.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
ai = "system.main:run"

[tool.uv.build-backend]
module-name = "system"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
