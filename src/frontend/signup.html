<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honeybee AI — Sign up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { bgMain: '#0B0F0D', bgSecondary: '#111713', surface: '#151C18', surfaceHover: '#1C2620',
                      borderSubtle: '#1E2B23', emeraldAccent: '#10B981', matcha: '#34D399', warmWhite: '#F3F4F6',
                      mutedGreen: '#9CA3AF', textMuted: '#6B7280' },
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            boxShadow: { glow: '0 0 35px -5px rgba(16, 185, 129, 0.3)' }
        } } }
    </script>
</head>
<body class="bg-bgMain text-warmWhite font-sans h-full antialiased flex items-center justify-center p-4">

    <a href="/" class="fixed top-5 left-5 text-xs text-textMuted hover:text-warmWhite transition-colors">
        <i class="fa-solid fa-arrow-left mr-1.5"></i>Honeybee AI
    </a>

    <div class="w-full max-w-sm bg-bgSecondary border border-borderSubtle rounded-2xl p-8 shadow-glow space-y-6">
        <div class="flex flex-col items-center space-y-3 text-center">
            <div class="w-11 h-11 bg-surface border border-emeraldAccent/40 rounded-xl flex items-center justify-center text-emeraldAccent">
                <svg class="w-5 h-5 " viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.4 9C17 7.8 16.2 7 15 6.5V5H14V6.4H13.6C12.5 6.4 11.6 6.8 10.8 7.6L10.4 8L9 7.5C8.7 7.4 8.4 7.3 8 7.3C7.4 7.3 6.8 7.5 6.3 7.9C5.7 8.3 5.4 8.8 5.2 9.3C5 10 5 10.6 5.2 11.3C5.5 12 5.8 12.5 6.3 12.8C5.9 14.3 6.2 15.6 7.3 16.7C8.1 17.5 9 17.9 10.1 17.9C10.6 17.9 10.9 17.9 11.2 17.8C11.8 18.6 12.6 19.1 13.6 19.1C13.9 19.1 14.3 19.1 14.6 19C15.2 18.8 15.6 18.4 16 17.9C16.4 17.3 16.6 16.8 16.6 16.2C16.6 15.8 16.6 15.5 16.5 15.2L16 13.6L16.6 13.2C17.4 12.4 17.8 11.3 17.7 10.1H19V9H17.4M7.7 11.3C7.1 11 6.9 10.6 7.1 10C7.3 9.4 7.7 9.2 8.3 9.4L11.5 10.6C9.9 11.4 8.7 11.6 7.7 11.3M14 16.9C13.4 17.1 13 16.9 12.7 16.3C12.4 15.3 12.6 14.1 13.4 12.5L14.6 15.6C14.8 16.3 14.6 16.7 14 16.9M15.2 11.6L14.6 10V9.9L14.3 9.6H14.2L12.6 9C13 8.7 13.4 8.5 13.9 8.5C14.4 8.5 14.9 8.7 15.3 9.1C15.7 9.5 15.9 9.9 15.9 10.4C15.7 10.7 15.5 11.2 15.2 11.6Z"/></svg>
            </div>
            <div>
                <h1 class="text-lg font-semibold tracking-tight">Create your hive</h1>
                <p class="text-xs text-mutedGreen mt-1">Your personal AI with memory, wherever you go</p>
            </div>
        </div>

        <form onsubmit="handleSignup(event)" class="space-y-4">
            <div class="space-y-1.5">
                <label class="text-[11px] font-medium text-mutedGreen uppercase tracking-wider">Name</label>
                <input required type="text" placeholder="Jonathan Davis"
                    class="w-full bg-surface border border-borderSubtle rounded-lg px-3 py-2.5 text-sm placeholder-textMuted focus:outline-none focus:border-emeraldAccent/50 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label class="text-[11px] font-medium text-mutedGreen uppercase tracking-wider">Email</label>
                <input required type="email" placeholder="you@example.com"
                    class="w-full bg-surface border border-borderSubtle rounded-lg px-3 py-2.5 text-sm placeholder-textMuted focus:outline-none focus:border-emeraldAccent/50 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label class="text-[11px] font-medium text-mutedGreen uppercase tracking-wider">Password</label>
                <input required minlength="8" type="password" placeholder="At least 8 characters"
                    class="w-full bg-surface border border-borderSubtle rounded-lg px-3 py-2.5 text-sm placeholder-textMuted focus:outline-none focus:border-emeraldAccent/50 transition-colors">
            </div>
            <button type="submit" class="w-full bg-emeraldAccent hover:bg-emerald-600 text-bgMain font-medium text-sm py-2.5 rounded-lg transition-colors">Create account</button>
        </form>

        <p class="text-center text-xs text-textMuted">
            Already have an account? <a href="/login" class="text-matcha hover:underline">Log in</a>
        </p>
    </div>

    <script>
        function handleSignup(e) {
            e.preventDefault();
            // Auth not implemented yet — go straight to the workspace.
            window.location.href = '/chat';
        }
    </script>
</body>
</html>
